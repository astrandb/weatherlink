name-template: "Example title - v2026.9.0"
tag-template: "v2026.9.0"

categories:
  - type: "pre-exclude"
    when:
      label: "skip-changelog"

  - title: "New Features"
    with:
      labels:
        - "feature"
        - "enhancement"
  - title: "Breaking changes"
    with:
      labels:
        - "breaking"
  - title: "Bug fixes"
    with:
      labels:
        - "fix"
        - "bugfix"
        - "bug"
  - title: "Translation"
    collapse-after: 2
    with:
      labels:
        - "translation"
  - title: "Dependencies"
    collapse-after: 2
    with:
      labels:
        - "dependencies"
        - "dependency"
  - title: "Maintenance"
    with:
      labels:
        - "maintenance"
  - title: "Code quality and optimizations"
    with:
      labels:
        - "code quality"
  - title: "Development tools"
    with:
      labels:
        - "development tools"
        - "dev-tools"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

template: |
  [![Downloads for this release](https://img.shields.io/github/downloads-pre/$OWNER/$REPOSITORY/v2026.9.0/total.svg)](
  https://github.com/$OWNER/$REPOSITORY/releases/v2026.9.0)

  <!--
  ### Checklist for release
  - Download translations PR from Lokalise
  - Run ruff linter
  - Run make bump - select proper variant in Makefile
  - Review the draft below and update if needed
  -->

  ## Notable Changes

  $CHANGES

autolabeler:
  - label: "maintenance"
    files:
      - "*.md"
      - ".github/*"
      - ".ruff.toml"
      - ".pre-commit-config.yaml"
  - label: "bugfix"
    title:
      - "/fix/i"
  - label: "code quality"
    title:
      - "lint"
  - label: "translation"
    title:
      - "Lokalise:"
    files:
      - "**/translations/*.json"
  - label: "development tools"
    files:
      - ".devcontainer/*"
      - ".devcontainer.json"
      - "Makefile"
      - "setup.cfg"
